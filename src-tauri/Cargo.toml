[package]
name = "shotdesk"
version = "0.1.0"
description = "A local-first screenshot library"
authors = ["Numera11y"]
edition = "2021"

[lib]
name = "shotdesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
kamadak-exif = "0.6.1"
# rapidocr-core 0.2.2 uses the ONNX Runtime rc12 Session API; keep this exact version until upstream updates.
ort = "=2.0.0-rc.12"
rusqlite = { version = "0.41", features = ["bundled"] }
rapidocr-core = { version = "0.2.2", default-features = false, features = ["model-download"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
walkdir = "2"

[profile.dev.package.rapidocr-core]
opt-level = 2

[profile.dev.package.image]
opt-level = 2

[profile.dev.package.imageproc]
opt-level = 2
